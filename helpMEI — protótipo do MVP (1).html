<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>helpMEI — protótipo do MVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap">
<style>
:root{
  --page:#E9ECF1; --app:#F5F6F8; --surface:#FFFFFF; --field:#FFFFFF;
  --ink:#13213A; --muted:#4B5563; --soft:#6B7280; --line:#E3E6EB; --field-line:#D5DAE1;
  --accent:#C2410C; --on-accent:#FFFFFF; --accent-soft:#FFF4EC; --accent-ink:#9A3412;
  --ok-soft:#E6F4F1; --ok-ink:#0F5F58; --hero:#13213A; --on-hero:#FFFFFF; --hero-muted:#D7DCE5;
  --chip-off:#E3E6EB; --disabled:#9AA3B2;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0A1120; --app:#0F1828; --surface:#162033; --field:#0F1828;
    --ink:#E8ECF3; --muted:#A7B0BF; --soft:#8E98A8; --line:#25314A; --field-line:#33405A;
    --accent:#C2410C; --on-accent:#FFFFFF; --accent-soft:#3A2416; --accent-ink:#FDBA8C;
    --ok-soft:#0E2E2A; --ok-ink:#7DD3C0; --hero:#22304A; --on-hero:#FFFFFF; --hero-muted:#C9D1DE;
    --chip-off:#25314A; --disabled:#4B5568;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --page:#0A1120; --app:#0F1828; --surface:#162033; --field:#0F1828;
  --ink:#E8ECF3; --muted:#A7B0BF; --soft:#8E98A8; --line:#25314A; --field-line:#33405A;
  --accent:#C2410C; --on-accent:#FFFFFF; --accent-soft:#3A2416; --accent-ink:#FDBA8C;
  --ok-soft:#0E2E2A; --ok-ink:#7DD3C0; --hero:#22304A; --on-hero:#FFFFFF; --hero-muted:#C9D1DE;
  --chip-off:#25314A; --disabled:#4B5568;
  color-scheme: dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top, 0px)}
body{margin:0;background:var(--page);color:var(--ink);font-family:Inter,"Segoe UI",Arial,sans-serif;min-height:100vh}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stage{max-width:1100px;margin:0 auto;padding:40px 24px;display:flex;flex-wrap:wrap;gap:48px;align-items:center;justify-content:center}
.intro{flex:1 1 320px;max-width:440px;display:flex;flex-direction:column;gap:18px}
.logo{font-family:"Space Grotesk",Arial,sans-serif;font-weight:700;letter-spacing:-.5px}
.logo b{color:var(--accent);font-weight:700}
.intro .logo{font-size:56px;line-height:1}
.intro p{margin:0;font-size:17px;line-height:1.55;color:var(--muted)}
.intro h1{margin:0;font-size:26px;line-height:1.25;font-family:"Space Grotesk",Arial,sans-serif}
.switch{display:flex;gap:8px;flex-wrap:wrap}
.switch button{height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--field-line);background:var(--surface);font-weight:700}
.switch button[aria-pressed="true"]{background:var(--hero);color:var(--on-hero);border-color:var(--hero)}
.note{font-size:13px;color:var(--soft);line-height:1.5}
.phone{position:relative;width:390px;max-width:100%;height:844px;max-height:calc(100vh - 32px);min-height:640px;border-radius:36px;border:10px solid var(--hero);background:var(--app);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 60px -30px rgba(10,17,32,.45)}
.hdr{height:64px;flex-shrink:0;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--surface);border-bottom:1px solid var(--line)}
.hdr .logo{font-size:24px;padding-left:6px;flex:1}
.hdr h2{margin:0;font-size:18px}
.icon-btn{width:44px;height:44px;border:none;background:transparent;border-radius:12px;display:flex;align-items:center;justify-content:center;position:relative}
.dot{position:absolute;top:8px;right:8px;width:16px;height:16px;border-radius:8px;background:var(--accent);color:var(--on-accent);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.main{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.main > *{flex-shrink:0}
.main{padding-bottom:76px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:12px;align-items:center}
.grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.av{border-radius:50%;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.t15{font-size:15px;font-weight:700}
.t13{font-size:13px;color:var(--muted);line-height:1.45}
.t12{font-size:12px;color:var(--muted)}
.ok{font-size:12px;font-weight:600;color:var(--ok-ink);display:inline-flex;align-items:center;gap:4px}
.hero{background:var(--hero);color:var(--on-hero);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px}
.hero .muted{color:var(--hero-muted);font-size:14px;line-height:1.45}
.big{font-family:"Space Grotesk",Arial,sans-serif;font-weight:700;font-size:20px}
.btn{height:48px;border:none;border-radius:12px;background:var(--accent);color:var(--on-accent);font-size:16px;font-weight:700;flex-shrink:0}
.btn:disabled{background:var(--disabled);cursor:not-allowed}
.btn-o{height:44px;border:1px solid var(--ink);border-radius:12px;background:var(--surface);font-size:15px;font-weight:700;flex-shrink:0}
.soft{background:var(--accent-soft);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px}
.soft .lbl{font-size:13px;font-weight:700;color:var(--accent-ink)}
.okbox{background:var(--ok-soft);color:var(--ok-ink);border-radius:12px;padding:12px 14px;font-size:14px;font-weight:600}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lab{font-size:13px;font-weight:600;color:var(--muted)}
.input,textarea{width:100%;border:1px solid var(--field-line);border-radius:12px;padding:0 12px;height:46px;background:var(--field);font-size:15px;min-width:0}
textarea{padding:12px;height:auto;line-height:1.45;resize:none}
.search{display:flex;align-items:center;gap:8px;background:var(--field);border:1px solid var(--field-line);border-radius:12px;padding:0 12px;height:46px}
.search input{flex:1;border:none;outline:none;background:transparent;font-size:15px;min-width:0}
.search:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--field-line);background:var(--surface);font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--hero);color:var(--on-hero);border-color:var(--hero)}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;background:var(--chip-off);border-radius:12px;padding:4px}
.seg button{height:40px;border:none;border-radius:9px;background:transparent;font-size:14px;font-weight:700}
.seg button[aria-selected="true"]{background:var(--surface)}
.status{align-self:flex-start;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px}
.bubble{max-width:78%;border-radius:16px;padding:10px 14px;font-size:14px;line-height:1.45}
.me{align-self:flex-end;background:var(--hero);color:var(--on-hero);border-bottom-right-radius:4px}
.them{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.chatbar{flex-shrink:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.nav{height:64px;flex-shrink:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.nav button{border:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;padding:0 2px;font-weight:700;color:var(--muted)}
.nav button[aria-current="page"]{color:var(--accent)}
.star{width:48px;height:48px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--disabled)}
.star.on{color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.kv{display:flex;flex-direction:column;gap:2px}
.kv span:first-child{font-size:12px;font-weight:600;color:var(--muted)}
.kv span:last-child{font-size:15px;font-weight:600;line-height:1.4}
.ph{aspect-ratio:1;border-radius:12px;background:var(--chip-off);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--muted);text-align:center;padding:6px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.link{border:none;background:transparent;color:var(--accent-ink);font-weight:700;text-decoration:underline;height:44px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.steps li{display:flex;gap:12px;align-items:flex-start;position:relative;padding-bottom:14px}
.steps li:last-child{padding-bottom:0}
.steps li:not(:last-child)::after{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--line)}
.steps li.done:not(:last-child)::after{background:var(--ok-ink)}
.steps .n{width:24px;height:24px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid var(--field-line);background:var(--surface);color:var(--muted)}
.steps li.done .n{background:var(--ok-ink);border-color:var(--ok-ink);color:var(--surface)}
.steps li.now .n{border-color:var(--accent);color:var(--accent-ink)}
.steps b{display:block;font-size:14px}
.steps small{display:block;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
.fab{position:absolute;right:14px;bottom:78px;height:48px;padding:0 16px 0 12px;border-radius:24px;border:none;background:var(--hero);color:var(--on-hero);display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;box-shadow:0 8px 20px -6px rgba(10,17,32,.5);z-index:5}
.check{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;border:1px solid var(--line)}
.check .box{width:28px;height:28px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:2px solid var(--field-line);color:transparent}
.check.on{border-color:var(--ok-ink);background:var(--ok-soft)}
.check.on .box{background:var(--ok-ink);border-color:var(--ok-ink);color:var(--surface)}
.badge{align-self:flex-start;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent-ink)}
details.faq{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px}
details.faq summary{min-height:48px;display:flex;align-items:center;font-size:14px;font-weight:700;cursor:pointer;list-style:none}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary::after{content:"+";margin-left:auto;font-size:20px;color:var(--muted)}
details.faq[open] summary::after{content:"–"}
details.faq p{margin:0 0 14px;font-size:13px;line-height:1.5;color:var(--muted)}
.car{position:relative;border-radius:12px;overflow:hidden;background:var(--chip-off)}
.car-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:12px}
.car-track::-webkit-scrollbar{display:none}
.car-slide{flex:0 0 100%;scroll-snap-align:start;margin:0;position:relative;height:170px}
.car-slide svg{width:100%;height:100%;display:block}
.car-slide figcaption{position:absolute;left:8px;bottom:8px;background:rgba(19,33,58,.8);color:#FFFFFF;font-size:12px;font-weight:600;padding:4px 8px;border-radius:6px;max-width:70%}
.car-btn{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:22px;border:none;background:rgba(255,255,255,.92);color:#13213A;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(10,17,32,.2)}
.car-btn.prev{left:6px}.car-btn.next{right:6px}
.car-dots{position:absolute;right:10px;bottom:12px;display:flex;gap:4px}
.car-dots span{width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.6);transition:width .2s}
.car-dots span.on{background:#FFFFFF;width:16px}
.redes{display:flex;gap:6px;flex-wrap:wrap}
.rede{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-radius:18px;border:1px solid var(--field-line);background:var(--surface);color:var(--ink);text-decoration:none;font-size:12px;font-weight:600}
.rede:hover{border-color:var(--ink)}
@media (max-width:520px){
  .stage{padding:0;gap:0}
  .intro{display:none}
  .phone{width:100%;height:100vh;height:100dvh;max-height:none;min-height:0;border:none;border-radius:0;box-shadow:none}
}
@media (prefers-reduced-motion:no-preference){.main{scroll-behavior:smooth}}
</style>
</head>
<body>
<div class="stage">
  <section class="intro" aria-label="Sobre o protótipo">
    <div class="logo">help<b>MEI</b></div>
    <h1>MEIs da economia criativa contratando MEIs, do pedido ao combinado em minutos.</h1>
    <p>Protótipo navegável do MVP. Faça um pedido, veja na hora quem pode atender, converse, feche o combinado e avalie.</p>
    <div class="switch" role="group" aria-label="Escolher tela">
      <button type="button" data-a="modo" data-v="app" aria-pressed="true">Usar o app</button>
      <button type="button" data-a="modo" data-v="cad" aria-pressed="false">Ver cadastro por CNPJ</button>
    </div>
    <p class="note">Hackathon Negócios em Transformação · Grupo 2. Pessoas, valores e avaliações são fictícios.</p>
  </section>
  <div class="phone" id="phone" aria-live="polite"></div>
</div>

      '<span class="t13" style="font-size:14px">Procuro 20 colares e 20 pulseiras artesanais, em cores variadas, para revender na loja no fim de ano.</span><span class="t13">Prazo: até 10/12 · Orçamento: a combinar</span>'+
      (S.propOk ? '<div class="okbox">Proposta enviada. Você será avisada quando a loja responder.</div>'
        : '<div class="row" style="gap:8px;align-items:stretch"><div class="field" style="flex:1"><label for="vp">Seu valor</label><input class="input" id="vp" value="R$ 1.400"></div><div class="field" style="flex:1"><label for="pp">Prazo</label><input class="input" id="pp" value="20 dias"></div></div><button type="button" class="btn" data-a="prop">Enviar proposta</button>')+'</div>';
  }
  function telaPublicacoes(){
    var lista = MEIS.slice().sort(function(a, b){ return (b.nota - a.nota) || (b.qtd - a.qtd); });
    var minha = '<article class="card" style="gap:10px"><div class="row"><span class="av" style="width:40px;height:40px;background:var(--accent)">'+iniciais(EU.negocio)+'</span><div class="grow"><span class="t15">Sua publicação</span><span class="t12">'+esc(EU.negocio)+' · agora</span></div></div>'+carrossel(ANA, true)+
      '<span class="t13" style="font-size:14px;color:var(--ink)">Colares e pulseiras em elos de contas coloridas. Peças únicas e encomendas por cor.</span>'+redes(ANA)+'</article>';
    return minha + '<div class="soft" style="flex-direction:row;align-items:center;gap:10px"><span class="t13" style="color:var(--ink)">Os MEIs mais bem avaliados aparecem primeiro. Boas avaliações dão mais visibilidade.</span></div>'+
      lista.map(function(m, i){
        var liked = !!S.curtidas[m.id], n = 20 + m.qtd * 3 + (liked ? 1 : 0);
        return '<article class="card" style="padding:0;overflow:hidden;gap:0">'+
          '<div class="row" style="padding:12px 14px">'+av(m,40)+'<div class="grow"><span class="t15">'+esc(m.nome)+'</span><span class="t12">'+esc(m.area)+' · '+esc(m.bairro)+'</span></div>'+
          '<span style="display:flex;flex-direction:column;align-items:flex-end;gap:2px"><span class="t15" style="font-size:14px">★ '+br(m.nota)+'</span><span class="t12">'+m.qtd+' avaliações</span></span></div>'+
          (i < 3 ? '<span class="badge" style="margin:0 14px 10px">Entre os mais bem avaliados</span>' : '')+
          '<div style="padding:0 14px">'+carrossel(m)+'</div>'+
          '<div style="padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px"><span class="t13" style="font-size:14px;color:var(--ink)">'+esc(m.fotos[0][1])+'. '+esc(m.msg)+'</span>'+
          '<div class="row" style="gap:8px"><button type="button" class="chip" data-a="curtir" data-v="'+m.id+'" aria-pressed="'+liked+'" style="display:flex;align-items:center;gap:6px">'+I.heart+n+'</button>'+
          '<button type="button" class="btn-o" style="flex:1;height:40px;font-size:14px" data-a="chat" data-v="'+m.id+'|publicacoes">Conversar</button></div></div></article>';
      }).join('');
  }
  function telaSuporte(){
    var faq = [
      ['Como funciona o combinado?','Depois de conversar, os dois confirmam o combinado com um check. Quando as duas confirmações acontecem, o combinado fecha e a avaliação abre para os dois.'],
      ['O helpMEI cuida do pagamento?','Não. O helpMEI conecta os MEIs e registra o combinado, mas o pagamento é acertado diretamente entre vocês, do jeito que preferirem.'],
      ['Como sei que o MEI é confiável?','Todo perfil mostra se o CNPJ está ativo, a nota e quantas avaliações recebeu. As avaliações só podem ser feitas depois de um combinado fechado.'],
      ['Ainda não tenho CNPJ. Posso usar?','Pode criar um perfil em formalização. Mostramos o caminho para abrir o MEI pelo Portal do Empreendedor, com apoio do Sebrae.'],
      ['Como denuncio um perfil ou um problema?','Use o botão Relatar um problema aqui embaixo. A equipe analisa e responde pelo seu WhatsApp.']
    ];
    return '<div class="hero" style="gap:8px"><span class="big">Como podemos ajudar?</span><span class="muted">Veja as dúvidas mais comuns ou fale com a nossa equipe.</span></div>'+
      faq.map(function(f){ return '<details class="faq"><summary>'+f[0]+'</summary><p>'+f[1]+'</p></details>'; }).join('')+
      (S.suporteOk ? '<div class="okbox">Mensagem enviada. O suporte responde pelo seu WhatsApp em até 1 dia útil.</div>'
        : '<button type="button" class="btn" data-a="suporte">Falar com o suporte</button><button type="button" class="btn-o" data-a="suporte">Relatar um problema</button>');
  }
  function telaMensagens(){
    return [['lucas','Te mando os mais próximos da sua proposta.','10:42'],['marina','Levo fundo e iluminação para o ensaio.','10:31'],['caio','Arquivo da estampa enviado!','Ontem']].map(function(c){
      var m = byId[c[0]];
      return '<button type="button" class="card row" style="text-align:left;flex-direction:row" data-a="chat" data-v="'+m.id+'|mensagens">'+av(m,46)+'<span class="grow"><span class="t15">'+esc(m.nome)+'</span><span class="t13" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+c[1]+'</span></span><span class="t12">'+c[2]+'</span></button>';
    }).join('');
  }
  function telaPerfil(){
    return '<div class="card" style="align-items:center;text-align:center;padding:18px;gap:12px"><span class="av" style="width:72px;height:72px;background:var(--accent);font-size:24px">'+iniciais(EU.negocio)+'</span>'+
      '<div style="display:flex;flex-direction:column;gap:4px"><span class="big">'+esc(EU.negocio)+'</span><span class="t13">Colares e pulseiras artesanais · Porto Alegre</span></div>'+
      '<span class="ok" style="font-size:13px;background:var(--ok-soft);padding:6px 10px;border-radius:8px">'+I.shield+'MEI ativo · CNPJ verificado</span>'+
      '<span class="t13">Perfil novo: as avaliações aparecem aqui depois do primeiro combinado fechado.</span></div>'+
      '<div style="display:flex;flex-direction:column;gap:6px"><span class="t15" style="font-size:14px">Ofereço</span><span class="t13" style="font-size:14px">Colares e pulseiras artesanais em elos de contas coloridas, peças únicas e encomendas por cor.</span><span class="t15" style="font-size:14px;margin-top:6px">Procuro</span><span class="t13" style="font-size:14px">Fotografia de produto, social media e embalagens para as peças.</span></div>'+
      '<div style="display:flex;flex-direction:column;gap:8px"><span class="t15" style="font-size:14px">Minhas peças e redes</span>'+carrossel(ANA, true)+redes(ANA)+'</div>'+
      '<div class="card row" style="flex-direction:row;padding:16px;gap:14px">'+I.qr+'<div class="grow" style="gap:8px"><span class="t15">QR code do seu perfil</span><span class="t13">Coloque na banca da feira, na etiqueta das peças ou no cartão.</span></div></div>'+
      '<div class="hero" style="gap:10px"><span style="font-size:13px;font-weight:700;color:#FDBA8C">helpMEI Pro</span><span class="big" style="font-size:18px">Apareça primeiro nas buscas</span><span class="muted" style="font-size:13px">Destaque no match, portfólio maior e pedidos novos antes de todo mundo. O contato continua gratuito.</span>'+
      (S.pro ? '<span class="okbox">Teste grátis do Pro ativado (simulação).</span>' : '<button type="button" class="btn" data-a="pro">Conhecer o Pro</button>')+'</div>';
  }
  function telaCadastro(){
    if (S.cad === 1) return '<div style="display:flex;flex-direction:column;gap:8px;padding-top:8px"><span class="big" style="font-size:26px;line-height:1.15">Cadastro em 2 minutos</span><span class="t13" style="font-size:15px;line-height:1.5">Informe o CNPJ do seu MEI. A gente busca seus dados públicos e verifica se ele está ativo.</span></div>'+
      '<div class="field"><label for="cnpj">CNPJ</label><input class="input" id="cnpj" inputmode="numeric" value="00.000.000/0001-00" style="height:52px;font-size:18px"><span class="t12">Número ilustrativo para a demonstração.</span></div>'+
      '<button type="button" class="btn" style="height:52px" data-a="cad" data-v="2">Buscar meus dados</button>'+
      (S.semCnpj ? '<div class="card"><span class="t15">Vamos te ajudar a se formalizar</span><span class="t13">Abrir um MEI é gratuito pelo Portal do Empreendedor, e o Sebrae e a Sala do Empreendedor de Porto Alegre ajudam no processo. Você pode criar um perfil “em formalização” enquanto isso.</span><a href="https://www.gov.br/empresas-e-negocios/pt-br/empreendedor" target="_blank" rel="noopener" style="color:var(--accent-ink);font-weight:700;font-size:14px">Ir para o Portal do Empreendedor</a></div>'
        : '<button type="button" class="link" data-a="semcnpj">Ainda não tenho CNPJ</button>')+
      '<div class="card" style="background:var(--chip-off);border:none;flex-direction:row"><span class="t12" style="line-height:1.5;color:var(--ink)">Usamos só os dados públicos do CNPJ e o que você informar. Nada é compartilhado sem a sua permissão.</span></div>';
    if (S.cad === 2) return '<div style="display:flex;flex-direction:column;gap:6px"><span class="big" style="font-size:24px">Encontramos seu MEI</span><span class="t13">Confira os dados e complete o que falta.</span></div>'+
      '<div class="card" style="gap:12px"><span class="ok" style="font-size:13px;font-weight:700;background:var(--ok-soft);padding:6px 10px;border-radius:8px;align-self:flex-start">'+I.shield+'Situação: ativa</span><div class="kv"><span>Nome empresarial</span><span>Dados do CNPJ (exemplo)</span></div><div class="kv"><span>Atividade principal</span><span>Fabricação de bijuterias e artefatos semelhantes (exemplo)</span></div><div class="kv"><span>Localização</span><span>Porto Alegre/RS</span></div></div>'+
      '<div class="field"><label for="fant">Nome que aparece no perfil</label><input class="input" id="fant" value="'+esc(EU.negocio)+'"></div>'+
      '<div class="field"><label for="ofe">O que você oferece? Escreva com suas palavras</label><textarea id="ofe" rows="2">Colares e pulseiras artesanais em elos de contas coloridas.</textarea></div>'+
      '<div class="field"><label for="pro2">E o que você costuma procurar?</label><textarea id="pro2" rows="2">Fotografia de produto, social media e embalagens.</textarea></div>'+
      '<button type="button" class="btn" style="height:52px" data-a="cad" data-v="3">Criar meu perfil</button>';
    return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center"><span class="av" style="width:80px;height:80px;background:var(--ok-soft);color:var(--ok-ink)">'+I.check+'</span><span class="big" style="font-size:26px">Perfil criado</span><span class="t13" style="font-size:15px;line-height:1.5">Seu perfil já tem o selo de CNPJ verificado. Encontramos MEIs criativos perto de você que oferecem o que você procura.</span>'+
      '<button type="button" class="btn" style="width:100%;height:52px" data-a="modo" data-v="app">Entrar no helpMEI</button><button type="button" class="link" style="color:var(--muted)" data-a="cad" data-v="1">Refazer cadastro</button></div>';
  }

  function nav(){
    var t = TAB[S.screen];
    return '<nav class="nav" aria-label="Navegação principal">'+[['home','Início',I.home],['publicacoes','Publicações',I.feed],['pedidos','Pedidos',I.list],['mensagens','Mensagens',I.msg],['perfil','Perfil',I.user]].map(function(x){
      return '<button type="button" data-a="go" data-v="'+x[0]+'"'+(t===x[0]?' aria-current="page"':'')+'>'+x[2]+x[1]+'</button>';
    }).join('')+'</nav>';
  }

  var phone = document.getElementById('phone');
  function render(keepScroll){
    var main = phone.querySelector('.main'), top = keepScroll && main ? main.scrollTop : 0;
    var html = header();
    if (S.modo === 'cad') { html += '<div class="main">'+telaCadastro()+'</div>'; }
    else {
      var fn = {home:telaHome,notif:telaNotif,pedido:telaPedido,propostas:telaPropostas,chat:telaChat,combinado:telaCombinado,avaliar:telaAvaliar,pedidos:telaPedidos,mensagens:telaMensagens,perfil:telaPerfil,publicacoes:telaPublicacoes,suporte:telaSuporte}[S.screen];
      html += '<div class="main">'+fn()+'</div>';
      if (S.screen === 'chat') html += '<div class="chatbar"><button type="button" class="btn" data-a="go" data-v="combinado">Fechar combinado</button><div class="row" style="gap:8px"><label for="msgin" class="sr">Mensagem</label><input class="input" id="msgin" readonly style="flex:1;border-radius:22px;background:var(--app)" value="'+(S.extra?'':'Fechado então! Pode ser dia 18?')+'"><button type="button" class="icon-btn" style="background:var(--hero);color:var(--on-hero);border-radius:22px" data-a="msg" aria-label="Enviar mensagem">'+I.send+'</button></div></div>';
      if (S.screen !== 'chat' && S.screen !== 'suporte') html += '<button type="button" class="fab" data-a="go" data-v="suporte" aria-label="Ajuda e suporte">'+I.help+'Ajuda</button>';
      html += nav();
    }
    phone.innerHTML = html;
    var m2 = phone.querySelector('.main'); if (m2) m2.scrollTop = top;
    document.querySelectorAll('.switch button').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.v === S.modo)); });
  }

  function act(a, v){
    var keep = false;
    if (a === 'go') { S.screen = v; S.toast = false; if (v === 'suporte') S.suporteOk = false; }
    else if (a === 'modo') { S.modo = v; if (v === 'app') S.screen = 'home'; }
    else if (a === 'chat') { var p = v.split('|'); S.chosen = p[0]; S.from = p[1]; S.screen = 'chat'; S.extra = false; S.etapa = 0; S.rating = 0; S.toast = false; }
    else if (a === 'ord') { S.ord = v; keep = true; }
    else if (a === 'paravoce') { S.screen = 'pedidos'; S.pedTab = 'voce'; S.toast = false; }
    else if (a === 'tab') { S.pedTab = v; }
    else if (a === 'prop') { S.propOk = true; keep = true; }
    else if (a === 'pro') { S.pro = true; keep = true; }
    else if (a === 'msg') { S.extra = true; }
    else if (a === 'etapa') { S.etapa = Number(v); keep = true; }
    else if (a === 'curtir') { S.curtidas[v] = !S.curtidas[v]; keep = true; }
    else if (a === 'suporte') { S.suporteOk = true; keep = true; }
    else if (a === 'avaliar') { if (S.etapa < 2) return; S.screen = 'avaliar'; S.rating = 0; }
    else if (a === 'star') { S.rating = Number(v); keep = true; }
    else if (a === 'enviarav') { S.screen = 'home'; S.toast = true; }
    else if (a === 'cad') { S.cad = Number(v); if (v === '1') S.semCnpj = false; }
    else if (a === 'semcnpj') { S.semCnpj = true; keep = true; }
    else return;
    render(keep);
    if (a === 'msg') { var mm = phone.querySelector('.main'); if (mm) mm.scrollTop = mm.scrollHeight; }
  }

  document.addEventListener('click', function(e){
    var b = e.target.closest('[data-a]');
    if (!b || !b.dataset.a) return;
    if (b.dataset.a === 'car') {
      var tr = b.closest('.car').querySelector('.car-track');
      var w = tr.clientWidth, n = tr.children.length, i = Math.round(tr.scrollLeft / w) + Number(b.dataset.v);
      if (i < 0) i = n - 1; if (i >= n) i = 0;
      tr.scrollTo({ left: i * w, behavior: 'smooth' });
      return;
    }
    act(b.dataset.a, b.dataset.v || '');
  });
  phone.addEventListener('input', function(e){
    if (e.target.id === 'busca') {
      S.q = e.target.value;
      document.getElementById('lista').innerHTML = listaHTML();
      document.getElementById('tituloLista').innerHTML = tituloLista();
    } else if (e.target.id === 'desc') {
      S.desc = e.target.value;
      document.getElementById('previa').innerHTML = previaHTML();
    }
  });

  phone.addEventListener('scroll', function(e){
    var tr = e.target;
    if (!tr.classList || !tr.classList.contains('car-track')) return;
    var i = Math.round(tr.scrollLeft / tr.clientWidth);
    var dots = tr.parentNode.querySelectorAll('.car-dots span');
    dots.forEach(function(d, k){ d.classList.toggle('on', k === i); });
  }, true);

  render(false);
})();
</script>
</body>
</html>
